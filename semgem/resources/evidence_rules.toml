[[model_rules]]
concept_id = "exchange:photon"
evidence_code = "specific_exchange_id_pattern"
entity_type = "reaction"
target_field = "original_id"
operator = "contains_all_normalized_groups"
value_groups = [["EX_"], ["photon", "light"]]
